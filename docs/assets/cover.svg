<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the StorCube integration (illustration). The StorCube logo
       (docs/assets/storcube-logo.png) is inlined by scripts/build-cover.sh:
       StorCube is a trademark of its owner; this project is not affiliated. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a5c"/>
      <stop offset="1" stop-color="#2b7bb0"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4f7f"/>
      <stop offset="1" stop-color="#0f2240"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#c9d4df"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <!-- the sun -->
  <g transform="translate(690 80)">
    <circle r="36" fill="#ffc83d"/>
    <g stroke="#ffc83d" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-50" x2="0" y2="-66"/><line x1="0" y1="50" x2="0" y2="66"/>
      <line x1="-50" y1="0" x2="-66" y2="0"/><line x1="50" y1="0" x2="66" y2="0"/>
      <line x1="35" y1="35" x2="47" y2="47"/><line x1="-35" y1="-35" x2="-47" y2="-47"/>
      <line x1="35" y1="-35" x2="47" y2="-47"/><line x1="-35" y1="35" x2="-47" y2="47"/>
    </g>
  </g>
  <!-- the logo card -->
  <rect x="36" y="34" width="372" height="88" rx="16" fill="#ffffff"/>
  <image x="60" y="52" width="324" height="46" preserveAspectRatio="xMidYMid meet" xlink:href="storcube-logo.png"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff">
    <text x="40" y="168" font-size="30" font-weight="bold">for Gladys Assistant</text>
    <text x="42" y="204" font-size="19" fill="#d6e9f7">balcony battery · solar · injection · scenes</text>
  </g>
  <!-- the balcony with its panel -->
  <g transform="translate(70 270)">
    <rect x="0" y="150" width="330" height="14" fill="#d9e2ec"/>
    <g stroke="#d9e2ec" stroke-width="6">
      <line x1="10" y1="164" x2="10" y2="240"/><line x1="90" y1="164" x2="90" y2="240"/>
      <line x1="170" y1="164" x2="170" y2="240"/><line x1="250" y1="164" x2="250" y2="240"/>
      <line x1="320" y1="164" x2="320" y2="240"/>
    </g>
    <g transform="translate(40 30) skewX(-12)">
      <rect x="0" y="0" width="200" height="118" rx="4" fill="url(#cell)" stroke="#9fb6cc" stroke-width="3"/>
      <g stroke="#5e7fa8" stroke-width="2">
        <line x1="50" y1="0" x2="50" y2="118"/><line x1="100" y1="0" x2="100" y2="118"/>
        <line x1="150" y1="0" x2="150" y2="118"/><line x1="0" y1="59" x2="200" y2="59"/>
      </g>
    </g>
  </g>
  <!-- the battery cube -->
  <g transform="translate(470 300)">
    <rect x="0" y="0" width="150" height="190" rx="18" fill="url(#cube)"/>
    <rect x="22" y="26" width="106" height="12" rx="6" fill="#0068b4"/>
    <rect x="22" y="60" width="106" height="104" rx="8" fill="#10233f"/>
    <rect x="30" y="100" width="90" height="56" rx="4" fill="#3ec27a"/>
    <path d="M80 70 L62 112 H76 L68 150 L94 104 H80 Z" fill="#ffffff"/>
  </g>
  <!-- the house -->
  <g transform="translate(670 330)">
    <polygon points="0,60 60,10 120,60" fill="#d9e2ec"/>
    <rect x="12" y="60" width="96" height="100" fill="#eef3f8"/>
    <rect x="46" y="100" width="28" height="60" fill="#7d8ea0"/>
  </g>
  <!-- the flows -->
  <g stroke="#ffc83d" stroke-width="6" fill="none" stroke-dasharray="14 10" stroke-linecap="round">
    <path d="M300 330 C370 330 420 360 462 380"/>
  </g>
  <g stroke="#7ee08a" stroke-width="6" fill="none" stroke-dasharray="14 10" stroke-linecap="round">
    <path d="M628 420 H664"/>
  </g>
</svg>
